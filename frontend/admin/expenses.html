<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backco — Expenses</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: #f5f5f3; color: #1a1a1a; }
    #page-content { padding-top: 64px; }
    .page { max-width: 1100px; margin: 0 auto; padding: 2rem; }

    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .page-title  { font-size: 1.6rem; font-weight: 700; }

    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: #fff; border: 1px solid #e5e5e1; border-radius: 10px; padding: 1.2rem 1.4rem; }
    .stat-label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #9ca3af; margin-bottom: 0.4rem; }
    .stat-value { font-size: 1.6rem; font-weight: 700; }

    .btn-primary { padding: 0.6rem 1.25rem; background: #1c3d2e; color: #fff; border: none; border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 0.88rem; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: #245038; }

    .toolbar { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 220px; padding: 0.6rem 1rem; border: 1px solid #e5e5e1; border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 0.88rem; background: #fff; outline: none; }
    .search-input:focus { border-color: #1c3d2e; }
    select { padding: 0.6rem 1rem; border: 1px solid #e5e5e1; border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 0.88rem; background: #fff; outline: none; }

    .card { background: #fff; border: 1px solid #e5e5e1; border-radius: 10px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 0.75rem 1.25rem; text-align: left; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9ca3af; background: #fafafa; border-bottom: 1px solid #f3f4f6; }
    td { padding: 1rem 1.25rem; font-size: 0.88rem; border-bottom: 1px solid #f9f9f8; color: #374151; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafaf9; }

    .cat-badge { display: inline-block; padding: 0.2rem 0.65rem; border-radius: 20px; font-size: 0.72rem; font-weight: 600; background: #f3f4f6; color: #374151; }

    .action-link { color: #1c3d2e; text-decoration: none; font-weight: 500; font-size: 0.82rem; cursor: pointer; background: none; border: none; padding: 0; font-family: 'Outfit', sans-serif; margin-right: 0.75rem; }
    .action-link:hover { text-decoration: underline; }
    .action-del { color: #dc2626; }

    .empty-state { text-align: center; padding: 3rem; color: #9ca3af; font-size: 0.88rem; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 500; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 2rem; width: 100%; max-width: 460px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
    .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.5rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.75rem; font-weight: 600; color: #6b7280; margin-bottom: 0.35rem; letter-spacing: 0.05em; text-transform: uppercase; }
    input, select, textarea { width: 100%; padding: 0.65rem 0.9rem; border: 1px solid #e5e5e1; border-radius: 7px; font-family: 'Outfit', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.15s; background: #fff; }
    input:focus, select:focus, textarea:focus { border-color: #1c3d2e; }
    .modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }
    .btn-cancel { padding: 0.6rem 1.25rem; background: transparent; border: 1px solid #e5e5e1; border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 0.88rem; font-weight: 600; cursor: pointer; color: #6b7280; }
    .msg { margin-top: 0.75rem; font-size: 0.82rem; color: #dc2626; }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <div id="page-content" style="display:none">
    <div class="page">
      <div class="page-header">
        <div class="page-title">Expenses</div>
        <button class="btn-primary" onclick="openModal()">+ Add Expense</button>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">Total Expenses</div>
          <div class="stat-value" id="s-total">$0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">This Month</div>
          <div class="stat-value" id="s-month">$0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Assigned</div>
          <div class="stat-value" id="s-assigned">$0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Unassigned</div>
          <div class="stat-value" id="s-unassigned">$0.00</div>
        </div>
      </div>

      <div class="toolbar">
        <input class="search-input" id="searchInput" type="text" placeholder="Search expenses..." oninput="filterExpenses()" />
        <select id="catFilter" onchange="filterExpenses()">
          <option value="">All Categories</option>
          <option value="materials">Materials</option>
          <option value="labor">Labor</option>
          <option value="equipment">Equipment</option>
          <option value="fuel">Fuel</option>
          <option value="subcontractor">Subcontractor</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Category</th>
              <th>Invoice</th>
              <th>Amount</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="expense-list">
            <tr><td colspan="6" class="empty-state">No expenses yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-title" id="modal-title">Add Expense</div>
      <input type="hidden" id="edit-id" />

      <div class="modal-row">
        <div class="field">
          <label>Date</label>
          <input type="date" id="f-date" />
        </div>
        <div class="field">
          <label>Amount ($)</label>
          <input type="number" id="f-amount" placeholder="0.00" step="0.01" min="0" />
        </div>
      </div>

      <div class="field">
        <label>Description</label>
        <input type="text" id="f-desc" placeholder="What was this expense for?" />
      </div>

      <div class="modal-row">
        <div class="field">
          <label>Category</label>
          <select id="f-cat">
            <option value="materials">Materials</option>
            <option value="labor">Labor</option>
            <option value="equipment">Equipment</option>
            <option value="fuel">Fuel</option>
            <option value="subcontractor">Subcontractor</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label>Assign to Invoice (optional)</label>
          <select id="f-invoice">
            <option value="">— Unassigned —</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Notes (optional)</label>
        <input type="text" id="f-notes" placeholder="Any additional notes..." />
      </div>

      <div class="msg" id="modal-msg"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" onclick="saveExpense()">Save Expense</button>
      </div>
    </div>
  </div>

  <script src="/js/backco-auth.js"></script>
  <script src="/js/admin-init.js"></script>
  <script>
    initAdmin('expenses');

    let expenses = [], invoices = [];

    async function loadData() {
      const token = Auth.getToken();
      try {
        const [eRes, iRes] = await Promise.all([
          fetch('/api/expenses', { headers: { Authorization: `Bearer ${token}` } }),
          fetch('/api/invoices', { headers: { Authorization: `Bearer ${token}` } })
        ]);
        if (eRes.ok) { const d = await eRes.json(); expenses = d.data; updateStats(); renderExpenses(expenses); }
        if (iRes.ok) {
          const d = await iRes.json();
          invoices = d.data;
          const sel = document.getElementById('f-invoice');
          invoices.forEach(inv => {
            const o = document.createElement('option');
            o.value = inv._id;
            o.textContent = `#${inv.invoiceNumber} — ${inv.customerName || 'No customer'}`;
            sel.appendChild(o);
          });
        }
      } catch {}
    }

    function updateStats() {
      const now   = new Date();
      const month = expenses.filter(e => new Date(e.date).getMonth() === now.getMonth() && new Date(e.date).getFullYear() === now.getFullYear());
      const fmt   = n => '$' + n.toFixed(2);
      document.getElementById('s-total').textContent      = fmt(expenses.reduce((s,e) => s + e.amount, 0));
      document.getElementById('s-month').textContent      = fmt(month.reduce((s,e) => s + e.amount, 0));
      document.getElementById('s-assigned').textContent   = fmt(expenses.filter(e => e.invoiceId).reduce((s,e) => s + e.amount, 0));
      document.getElementById('s-unassigned').textContent = fmt(expenses.filter(e => !e.invoiceId).reduce((s,e) => s + e.amount, 0));
    }

    function renderExpenses(list) {
      const tbody = document.getElementById('expense-list');
      if (!list.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No expenses found.</td></tr>'; return; }
      tbody.innerHTML = list.map(e => `
        <tr>
          <td>${e.date ? new Date(e.date).toLocaleDateString() : '—'}</td>
          <td>${e.description}</td>
          <td><span class="cat-badge">${e.category}</span></td>
          <td>${e.invoiceNumber ? `<a href="/admin/invoice?id=${e.invoiceId}" style="color:#1c3d2e">#${e.invoiceNumber}</a>` : '—'}</td>
          <td style="font-weight:600">$${e.amount.toFixed(2)}</td>
          <td>
            <button class="action-link" onclick="editExpense('${e._id}')">Edit</button>
            <button class="action-link action-del" onclick="deleteExpense('${e._id}')">Delete</button>
          </td>
        </tr>`).join('');
    }

    function filterExpenses() {
      const q   = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('catFilter').value;
      renderExpenses(expenses.filter(e =>
        (!cat || e.category === cat) &&
        e.description.toLowerCase().includes(q)
      ));
    }

    function openModal(reset = true) {
      if (reset) {
        document.getElementById('modal-title').textContent = 'Add Expense';
        document.getElementById('edit-id').value = '';
        document.getElementById('f-date').value   = new Date().toISOString().split('T')[0];
        document.getElementById('f-amount').value = '';
        document.getElementById('f-desc').value   = '';
        document.getElementById('f-cat').value    = 'materials';
        document.getElementById('f-invoice').value = '';
        document.getElementById('f-notes').value  = '';
      }
      document.getElementById('modal-msg').textContent = '';
      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

    function editExpense(id) {
      const e = expenses.find(x => x._id === id);
      if (!e) return;
      document.getElementById('modal-title').textContent = 'Edit Expense';
      document.getElementById('edit-id').value   = e._id;
      document.getElementById('f-date').value    = e.date ? new Date(e.date).toISOString().split('T')[0] : '';
      document.getElementById('f-amount').value  = e.amount;
      document.getElementById('f-desc').value    = e.description;
      document.getElementById('f-cat').value     = e.category;
      document.getElementById('f-invoice').value = e.invoiceId || '';
      document.getElementById('f-notes').value   = e.notes || '';
      openModal(false);
    }

    async function saveExpense() {
      const token = Auth.getToken();
      const id    = document.getElementById('edit-id').value;
      const body  = {
        date:        document.getElementById('f-date').value,
        amount:      parseFloat(document.getElementById('f-amount').value),
        description: document.getElementById('f-desc').value.trim(),
        category:    document.getElementById('f-cat').value,
        invoiceId:   document.getElementById('f-invoice').value || null,
        notes:       document.getElementById('f-notes').value.trim()
      };

      if (!body.description || isNaN(body.amount)) {
        document.getElementById('modal-msg').textContent = 'Description and amount are required.';
        return;
      }

      const url = id ? `/api/expenses/${id}` : '/api/expenses';
      try {
        const res  = await fetch(url, {
          method: id ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) { closeModal(); loadData(); }
        else document.getElementById('modal-msg').textContent = data.message || 'Save failed.';
      } catch { document.getElementById('modal-msg').textContent = 'Connection error.'; }
    }

    async function deleteExpense(id) {
      if (!confirm('Delete this expense?')) return;
      const token = Auth.getToken();
      try {
        await fetch(`/api/expenses/${id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
        loadData();
      } catch {}
    }

    document.getElementById('modalOverlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });

    loadData();
  </script>
</body>
</html>
