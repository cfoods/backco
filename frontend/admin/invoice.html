<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backco — Invoice</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: #f5f5f3; color: #1a1a1a; }
    #page-content { padding-top: 64px; }
    .page { max-width: 900px; margin: 0 auto; padding: 2rem; }

    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .page-title  { font-size: 1.6rem; font-weight: 700; }

    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .btn { padding: 0.6rem 1.25rem; border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 0.88rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
    .btn-primary   { background: #1c3d2e; color: #fff; }
    .btn-primary:hover { background: #245038; }
    .btn-secondary { background: #fff; color: #374151; border: 1px solid #e5e5e1; }
    .btn-secondary:hover { border-color: #1c3d2e; color: #1c3d2e; }
    .btn-danger { background: #fee2e2; color: #dc2626; }
    .btn-danger:hover { background: #fecaca; }

    /* Sections */
    .section {
      background: #fff;
      border: 1px solid #e5e5e1;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    .section-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #9ca3af; margin-bottom: 1.25rem; }

    /* Fields */
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .field { margin-bottom: 0; }
    label { display: block; font-size: 0.72rem; font-weight: 600; color: #6b7280; margin-bottom: 0.35rem; letter-spacing: 0.06em; text-transform: uppercase; }
    input, select, textarea {
      width: 100%; padding: 0.65rem 0.9rem;
      border: 1px solid #e5e5e1; border-radius: 7px;
      font-family: 'Outfit', sans-serif; font-size: 0.9rem;
      outline: none; transition: border-color 0.15s; background: #fff; color: #1a1a1a;
    }
    input:focus, select:focus, textarea:focus { border-color: #1c3d2e; }
    textarea { resize: vertical; min-height: 70px; }

    /* Customer search */
    .cust-search-wrap { position: relative; }
    .cust-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: #fff;
      border: 1px solid #e5e5e1;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      z-index: 50;
      max-height: 220px;
      overflow-y: auto;
    }
    .cust-dropdown.open { display: block; }
    .cust-option {
      padding: 0.7rem 1rem;
      cursor: pointer;
      font-size: 0.88rem;
      border-bottom: 1px solid #f3f4f6;
      transition: background 0.1s;
    }
    .cust-option:last-child { border-bottom: none; }
    .cust-option:hover { background: #f9fafb; }
    .cust-option-name { font-weight: 600; color: #1a1a1a; }
    .cust-option-email { font-size: 0.78rem; color: #9ca3af; }
    .cust-option-new { color: #1c3d2e; font-weight: 600; }
    .cust-selected {
      display: none;
      padding: 0.75rem 1rem;
      background: rgba(28,61,46,0.05);
      border: 1px solid rgba(28,61,46,0.2);
      border-radius: 7px;
      margin-bottom: 0.75rem;
      font-size: 0.88rem;
    }
    .cust-selected.show { display: flex; align-items: center; justify-content: space-between; }
    .cust-clear { color: #9ca3af; cursor: pointer; font-size: 0.8rem; background: none; border: none; font-family: 'Outfit', sans-serif; }
    .cust-clear:hover { color: #dc2626; }

    /* Line items */
    .items-table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
    .items-table th { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #9ca3af; padding: 0.5rem 0.5rem; text-align: left; border-bottom: 1px solid #f3f4f6; }
    .items-table td { padding: 0.4rem 0.5rem; vertical-align: middle; }
    .items-table input { padding: 0.55rem 0.75rem; font-size: 0.88rem; }
    .item-desc { width: 40%; }
    .item-qty  { width: 12%; }
    .item-rate { width: 18%; }
    .item-amt  { width: 18%; }
    .item-del  { width: 8%; text-align: center; }

    .item-amount { padding: 0.55rem 0.75rem; font-weight: 600; color: #1a1a1a; font-size: 0.88rem; }
    .del-btn { background: none; border: none; color: #d1d5db; cursor: pointer; font-size: 1.1rem; padding: 0.25rem; transition: color 0.15s; }
    .del-btn:hover { color: #dc2626; }

    .add-line-btn { background: none; border: 1px dashed #d1d5db; border-radius: 7px; padding: 0.6rem 1rem; color: #6b7280; font-family: 'Outfit', sans-serif; font-size: 0.85rem; font-weight: 500; cursor: pointer; width: 100%; transition: all 0.15s; }
    .add-line-btn:hover { border-color: #1c3d2e; color: #1c3d2e; }

    /* Totals */
    .totals { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; padding-top: 1rem; border-top: 1px solid #f3f4f6; }
    .total-line { display: flex; gap: 2rem; align-items: center; font-size: 0.9rem; }
    .total-line label { text-transform: none; letter-spacing: 0; font-size: 0.9rem; color: #6b7280; margin: 0; width: auto; }
    .total-line span { font-weight: 600; min-width: 100px; text-align: right; }
    .total-line input { width: 90px; text-align: right; padding: 0.4rem 0.6rem; font-size: 0.88rem; }
    .total-grand { font-size: 1.1rem; font-weight: 700; color: #1c3d2e; }

    .status-row { display: flex; align-items: center; gap: 0.75rem; }

    .msg-bar { padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .msg-bar.show { display: block; }
    .msg-bar.success { background: #dcfce7; color: #16a34a; }
    .msg-bar.error   { background: #fee2e2; color: #dc2626; }

    @media (max-width: 640px) {
      .field-row, .field-row-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <div id="page-content" style="display:none">
    <div class="page">
      <div class="page-header">
        <div class="page-title" id="page-title">New Invoice</div>
        <div class="actions">
          <button class="btn btn-secondary" onclick="window.location='/admin/invoices'">← Back</button>
          <button class="btn btn-secondary" id="btn-draft" onclick="saveInvoice('draft')">Save Draft</button>
          <button class="btn btn-primary" onclick="saveInvoice('pending')">Save Invoice</button>
        </div>
      </div>

      <div class="msg-bar" id="msgBar"></div>

      <!-- Customer -->
      <div class="section">
        <div class="section-title">Customer</div>
        <div class="cust-selected" id="custSelected">
          <span id="custSelectedName">—</span>
          <button class="cust-clear" onclick="clearCustomer()">✕ Change</button>
        </div>
        <div id="custSearchArea">
          <div class="cust-search-wrap">
            <input type="text" id="custSearch" placeholder="Search for a customer or type to add new..." oninput="searchCustomers()" onfocus="searchCustomers()" autocomplete="off" />
            <div class="cust-dropdown" id="custDropdown"></div>
          </div>
        </div>
        <input type="hidden" id="customerId" />
      </div>

      <!-- Invoice Details -->
      <div class="section">
        <div class="section-title">Invoice Details</div>
        <div class="field-row-3">
          <div class="field">
            <label>Invoice #</label>
            <input type="text" id="f-number" placeholder="Auto-generated" />
          </div>
          <div class="field">
            <label>Invoice Date</label>
            <input type="date" id="f-date" />
          </div>
          <div class="field">
            <label>Due Date</label>
            <input type="date" id="f-due" />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Status</label>
            <select id="f-status">
              <option value="draft">Draft</option>
              <option value="pending" selected>Pending</option>
              <option value="paid">Paid</option>
              <option value="overdue">Overdue</option>
            </select>
          </div>
          <div class="field">
            <label>Job / Project Name (optional)</label>
            <input type="text" id="f-job" placeholder="e.g. Backyard renovation" />
          </div>
        </div>
      </div>

      <!-- Line Items -->
      <div class="section">
        <div class="section-title">Line Items</div>
        <table class="items-table">
          <thead>
            <tr>
              <th class="item-desc">Description</th>
              <th class="item-qty">Qty</th>
              <th class="item-rate">Rate ($)</th>
              <th class="item-amt">Amount</th>
              <th class="item-del"></th>
            </tr>
          </thead>
          <tbody id="line-items"></tbody>
        </table>
        <button class="add-line-btn" onclick="addLine()">+ Add Line Item</button>

        <div class="totals">
          <div class="total-line">
            <label>Subtotal</label>
            <span id="subtotal">$0.00</span>
          </div>
          <div class="total-line">
            <label>Tax (%)</label>
            <input type="number" id="tax-rate" value="0" min="0" max="100" step="0.5" oninput="calcTotals()" />
            <span id="tax-amt">$0.00</span>
          </div>
          <div class="total-line">
            <label>Discount ($)</label>
            <input type="number" id="discount" value="0" min="0" step="0.01" oninput="calcTotals()" />
            <span id="discount-amt">$0.00</span>
          </div>
          <div class="total-line">
            <label style="font-weight:700;color:#1a1a1a">Total</label>
            <span class="total-grand" id="total">$0.00</span>
          </div>
        </div>
      </div>

      <!-- Notes -->
      <div class="section">
        <div class="section-title">Notes</div>
        <textarea id="f-notes" placeholder="Thank you for your business! Payment is due within 30 days."></textarea>
      </div>

      <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-bottom:2rem">
        <button class="btn btn-secondary" id="btn-delete" style="display:none" onclick="deleteInvoice()">Delete Invoice</button>
        <button class="btn btn-secondary" onclick="saveInvoice('draft')">Save Draft</button>
        <button class="btn btn-primary" onclick="saveInvoice('pending')">Save Invoice</button>
      </div>
    </div>
  </div>

  <script src="/js/backco-auth.js"></script>
  <script src="/js/admin-init.js"></script>
  <script>
    initAdmin('create');

    let customers = [], editId = null;

    // Set default dates
    const today = new Date().toISOString().split('T')[0];
    const due   = new Date(Date.now() + 30*24*60*60*1000).toISOString().split('T')[0];
    document.getElementById('f-date').value = today;
    document.getElementById('f-due').value  = due;

    // Load customers + check if editing
    async function init() {
      const token = Auth.getToken();
      try {
        const res  = await fetch('/api/customers', { headers: { Authorization: `Bearer ${token}` } });
        const data = await res.json();
        if (data.success) customers = data.data;
      } catch {}

      // Auto-generate invoice number
      try {
        const res  = await fetch('/api/invoices/next-number', { headers: { Authorization: `Bearer ${token}` } });
        const data = await res.json();
        if (data.success) document.getElementById('f-number').value = data.number;
      } catch {
        document.getElementById('f-number').placeholder = 'e.g. 001';
      }

      // Check for edit mode
      const params = new URLSearchParams(window.location.search);
      editId = params.get('id');
      if (editId) {
        document.getElementById('page-title').textContent = 'Edit Invoice';
        document.getElementById('btn-delete').style.display = 'inline-block';
        loadInvoice(editId);
      } else {
        addLine(); // start with one empty line
      }
    }

    async function loadInvoice(id) {
      const token = Auth.getToken();
      try {
        const res  = await fetch(`/api/invoices/${id}`, { headers: { Authorization: `Bearer ${token}` } });
        const data = await res.json();
        if (!data.success) return;
        const inv = data.data;
        document.getElementById('f-number').value  = inv.invoiceNumber || '';
        document.getElementById('f-date').value    = inv.date ? new Date(inv.date).toISOString().split('T')[0] : today;
        document.getElementById('f-due').value     = inv.dueDate ? new Date(inv.dueDate).toISOString().split('T')[0] : due;
        document.getElementById('f-status').value  = inv.status || 'pending';
        document.getElementById('f-job').value     = inv.jobName || '';
        document.getElementById('f-notes').value   = inv.notes || '';
        document.getElementById('tax-rate').value  = inv.taxRate || 0;
        document.getElementById('discount').value  = inv.discount || 0;
        if (inv.customerId) selectCustomer({ _id: inv.customerId, firstName: inv.customerFirstName, lastName: inv.customerLastName, email: inv.customerEmail });
        (inv.lineItems || []).forEach(li => addLine(li));
        calcTotals();
      } catch {}
    }

    // ── Customer search ────────────────────────────────────────────────────────
    function searchCustomers() {
      const q   = document.getElementById('custSearch').value.toLowerCase().trim();
      const dd  = document.getElementById('custDropdown');
      const filtered = customers.filter(c =>
        `${c.firstName} ${c.lastName} ${c.email} ${c.phone}`.toLowerCase().includes(q)
      ).slice(0, 8);

      let html = filtered.map(c => `
        <div class="cust-option" onclick="selectCustomer(${JSON.stringify(c).replace(/"/g,'&quot;')})">
          <div class="cust-option-name">${c.firstName} ${c.lastName}</div>
          <div class="cust-option-email">${c.email || c.phone || ''}</div>
        </div>`).join('');

      if (q) {
        html += `<div class="cust-option cust-option-new" onclick="quickAddCustomer('${q.replace(/'/,'')}')">
          + Add "${document.getElementById('custSearch').value}" as new customer
        </div>`;
      }

      dd.innerHTML = html || '<div class="cust-option" style="color:#9ca3af">No customers found</div>';
      dd.classList.add('open');
    }

    function selectCustomer(c) {
      document.getElementById('customerId').value = c._id;
      document.getElementById('custSelectedName').textContent = `${c.firstName} ${c.lastName}${c.email ? ' — ' + c.email : ''}`;
      document.getElementById('custSelected').classList.add('show');
      document.getElementById('custSearchArea').style.display = 'none';
      document.getElementById('custDropdown').classList.remove('open');
    }

    function clearCustomer() {
      document.getElementById('customerId').value = '';
      document.getElementById('custSelected').classList.remove('show');
      document.getElementById('custSearchArea').style.display = 'block';
      document.getElementById('custSearch').value = '';
      document.getElementById('custSearch').focus();
    }

    async function quickAddCustomer(name) {
      const parts = name.split(' ');
      const body  = { firstName: parts[0] || name, lastName: parts.slice(1).join(' ') || '—' };
      const token = Auth.getToken();
      try {
        const res  = await fetch('/api/customers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) { customers.push(data.data); selectCustomer(data.data); }
      } catch {}
    }

    // Close dropdown on outside click
    document.addEventListener('click', e => {
      if (!e.target.closest('.cust-search-wrap')) document.getElementById('custDropdown').classList.remove('open');
    });

    // ── Line Items ─────────────────────────────────────────────────────────────
    let lineId = 0;

    function addLine(data = {}) {
      const id = ++lineId;
      const tbody = document.getElementById('line-items');
      const tr = document.createElement('tr');
      tr.id = `line-${id}`;
      tr.innerHTML = `
        <td class="item-desc"><input type="text" placeholder="Description of work..." value="${data.description || ''}" /></td>
        <td class="item-qty"><input type="number" min="0" step="any" value="${data.qty ?? 1}" oninput="calcLine(${id})" /></td>
        <td class="item-rate"><input type="number" min="0" step="0.01" value="${data.rate ?? ''}" placeholder="0.00" oninput="calcLine(${id})" /></td>
        <td class="item-amt"><div class="item-amount" id="amt-${id}">$0.00</div></td>
        <td class="item-del"><button class="del-btn" onclick="removeLine(${id})">✕</button></td>`;
      tbody.appendChild(tr);
      calcLine(id);
    }

    function calcLine(id) {
      const row  = document.getElementById(`line-${id}`);
      const qty  = parseFloat(row.querySelectorAll('input')[1].value) || 0;
      const rate = parseFloat(row.querySelectorAll('input')[2].value) || 0;
      const amt  = qty * rate;
      document.getElementById(`amt-${id}`).textContent = '$' + amt.toFixed(2);
      calcTotals();
    }

    function removeLine(id) {
      document.getElementById(`line-${id}`)?.remove();
      calcTotals();
    }

    function calcTotals() {
      const rows = document.querySelectorAll('#line-items tr');
      let sub = 0;
      rows.forEach(row => {
        const inputs = row.querySelectorAll('input');
        if (inputs.length >= 3) {
          sub += (parseFloat(inputs[1].value) || 0) * (parseFloat(inputs[2].value) || 0);
        }
      });
      const taxRate  = parseFloat(document.getElementById('tax-rate').value) || 0;
      const discount = parseFloat(document.getElementById('discount').value) || 0;
      const taxAmt   = sub * (taxRate / 100);
      const total    = Math.max(sub + taxAmt - discount, 0);
      document.getElementById('subtotal').textContent    = '$' + sub.toFixed(2);
      document.getElementById('tax-amt').textContent     = '$' + taxAmt.toFixed(2);
      document.getElementById('discount-amt').textContent = '-$' + discount.toFixed(2);
      document.getElementById('total').textContent       = '$' + total.toFixed(2);
    }

    function getLineItems() {
      return [...document.querySelectorAll('#line-items tr')].map(row => {
        const inputs = row.querySelectorAll('input');
        return {
          description: inputs[0]?.value || '',
          qty:  parseFloat(inputs[1]?.value) || 0,
          rate: parseFloat(inputs[2]?.value) || 0,
          amount: (parseFloat(inputs[1]?.value) || 0) * (parseFloat(inputs[2]?.value) || 0)
        };
      });
    }

    // ── Save ───────────────────────────────────────────────────────────────────
    async function saveInvoice(status) {
      const token = Auth.getToken();
      const lineItems = getLineItems();
      const taxRate   = parseFloat(document.getElementById('tax-rate').value) || 0;
      const discount  = parseFloat(document.getElementById('discount').value) || 0;
      const sub       = lineItems.reduce((s, l) => s + l.amount, 0);
      const total     = Math.max(sub + (sub * taxRate / 100) - discount, 0);

      const body = {
        customerId:    document.getElementById('customerId').value || null,
        invoiceNumber: document.getElementById('f-number').value,
        date:          document.getElementById('f-date').value,
        dueDate:       document.getElementById('f-due').value,
        status:        document.getElementById('f-status').value || status,
        jobName:       document.getElementById('f-job').value,
        notes:         document.getElementById('f-notes').value,
        lineItems, taxRate, discount, subtotal: sub, total
      };

      const url    = editId ? `/api/invoices/${editId}` : '/api/invoices';
      const method = editId ? 'PUT' : 'POST';

      try {
        const res  = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
          showMsg('Invoice saved!', 'success');
          if (!editId) {
            editId = data.data._id;
            document.getElementById('btn-delete').style.display = 'inline-block';
            history.replaceState(null, '', `/admin/invoice?id=${editId}`);
          }
        } else showMsg(data.message || 'Save failed.', 'error');
      } catch { showMsg('Connection error.', 'error'); }
    }

    async function deleteInvoice() {
      if (!editId || !confirm('Delete this invoice?')) return;
      const token = Auth.getToken();
      try {
        await fetch(`/api/invoices/${editId}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
        window.location = '/admin/invoices';
      } catch { showMsg('Delete failed.', 'error'); }
    }

    function showMsg(msg, type) {
      const bar = document.getElementById('msgBar');
      bar.textContent = msg;
      bar.className = `msg-bar show ${type}`;
      setTimeout(() => bar.classList.remove('show'), 4000);
    }

    init();
  </script>
</body>
</html>
